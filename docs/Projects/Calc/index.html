<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="A clean, keyboard-friendly calculator for everyday arithmetic."
    />
    <title>Calculator | Arinda Coleb</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <strong
        >ARINDA COLEB <span style="color: #38c5c0">/ Projects</span></strong
      ><a href="../../index.html">← Portfolio</a>
    </header>
    <main>
      <h1>Calculator</h1>
      <p class="lead">
        A clean, keyboard-friendly calculator for everyday arithmetic.
      </p>
      <section class="panel calc">
        <div class="screen" aria-live="polite">
          <div id="expression" class="expression">&nbsp;</div>
          <div id="display" class="display">0</div>
        </div>
        <div class="keys">
          <button data-action="clear" class="utility">AC</button
          ><button data-action="delete" class="utility">DEL</button
          ><button data-action="percent" class="utility">%</button
          ><button data-action="operator" data-value="/" class="operator">
            ÷</button
          ><button data-value="7">7</button><button data-value="8">8</button
          ><button data-value="9">9</button
          ><button data-action="operator" data-value="*" class="operator">
            ×</button
          ><button data-value="4">4</button><button data-value="5">5</button
          ><button data-value="6">6</button
          ><button data-action="operator" data-value="-" class="operator">
            −</button
          ><button data-value="1">1</button><button data-value="2">2</button
          ><button data-value="3">3</button
          ><button data-action="operator" data-value="+" class="operator">
            +</button
          ><button data-action="sign" class="utility">±</button
          ><button data-value="0">0</button><button data-value=".">.</button
          ><button data-action="equals" class="equals">=</button>
        </div>
        <p class="muted">
          Keyboard: numbers, +, −, *, /, Enter, Backspace, Escape.
        </p>
      </section>
    </main>
  </body>
</html>
