<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Track your income, spending, and remaining balance. Data stays in this browser."><title>Expense Tracker | Arinda Coleb</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body><header><strong>ARINDA COLEB <span style="color:#38c5c0">/ Projects</span></strong><a href="../../index.html">← Portfolio</a></header><main><h1>Expense Tracker</h1><p class="lead">Track your income, spending, and remaining balance. Data stays in this browser.</p><section class="grid"><div class="stat"><span>Balance</span><strong id="balance">SAR 0.00</strong></div><div class="stat"><span>Income</span><strong id="income">SAR 0.00</strong></div><div class="stat"><span>Expenses</span><strong id="expenses">SAR 0.00</strong></div></section><section class="panel" style="margin-top:20px"><h2>Add transaction</h2><form id="transaction-form" class="form-grid"><label>Description<input id="description" maxlength="80" required placeholder="e.g. Groceries"></label><label>Amount (SAR)<input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></label><label>Type<select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></label><label>Category<select id="category"><option>Food</option><option>Housing</option><option>Transport</option><option>Shopping</option><option>Health</option><option>Salary</option><option>Savings</option><option>Other</option></select></label><label>Date<input id="date" type="date" required></label><button type="submit">Add transaction</button></form><p class="message" id="notice" aria-live="polite"></p></section><section class="panel"><div class="row" style="justify-content:space-between"><h2>Transactions</h2><button class="secondary" id="export">Export CSV</button></div><div class="row"><input id="search" placeholder="Search descriptions" aria-label="Search descriptions" style="flex:2;min-width:170px"><select id="filter" aria-label="Filter transaction type" style="flex:1;min-width:140px"><option value="all">All types</option><option value="income">Income</option><option value="expense">Expenses</option></select></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr></thead><tbody id="transactions"></tbody></table></div><p class="muted" id="empty">No transactions yet.</p></section></main></body></html>
